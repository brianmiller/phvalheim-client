name: macOS build + verify

# Apple Silicon runners are free and unlimited on public repos, which makes this
# the only place we can answer the question no Linux check can: does macOS agree
# to RUN what we shipped? An unsigned or wrongly-signed arm64 Mach-O is SIGKILLed
# by AMFI at exec and looks perfectly healthy to every static check.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '**.cs'
      - 'phvalheim-client.csproj'
      - 'builders/build_macos-innie'
      - 'builders/url-handler.swift'
      - 'builders/verify_macos.sh'
      - 'builders/verify_macos_gui.sh'
      - 'builders/ci_summary.sh'
      - 'macinstall.sh'
      - '.github/workflows/macos-verify.yml'
  pull_request:

jobs:
  # ── What can this runner actually observe? ───────────────────────────────────
  # Reports whether there is a GUI (Aqua) session. Never fails: it exists to
  # replace a guess with a measurement, not to gate anything. Whether the
  # phvalheim:// handler can be exercised end-to-end depends on the answer.
  runner-probe:
    name: Probe runner capabilities
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Report session and tooling
        run: |
          {
            echo "## ℹ️ Runner capabilities"
            echo
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Hardware | \`$(uname -m)\` |"
            echo "| macOS | $(sw_vers -productVersion) ($(sw_vers -buildVersion)) |"
            echo "| CPUs / RAM | $(sysctl -n hw.ncpu) / $(( $(sysctl -n hw.memsize) / 1073741824 )) GB |"
            echo "| launchd session type | \`$(launchctl managername 2>/dev/null || echo unknown)\` |"
            echo "| Console owner | \`$(stat -f%Su /dev/console 2>/dev/null || echo unknown)\` |"
            echo "| WindowServer running | $(pgrep -x WindowServer >/dev/null && echo 'yes' || echo 'no') |"
            echo "| Can screencapture | $(screencapture -x /tmp/p.png 2>/dev/null && echo 'yes' || echo 'no') |"
            echo "| Terminal.app present | $([ -d /System/Applications/Utilities/Terminal.app ] && echo 'yes' || echo 'no') |"
            echo "| swiftc | $(swiftc --version 2>/dev/null | head -1) |"
            echo "| Passwordless sudo | $(sudo -n true 2>/dev/null && echo 'yes' || echo 'no') |"
            echo
            echo "A GUI session is what the \`phvalheim://\` handler needs — it forwards the"
            echo "URL to Terminal.app via an Apple Event. Without one, scheme *registration*"
            echo "is still testable but *activation* is not."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # tee, not plain redirect: a probe whose answer only exists in the
          # rendered summary cannot be read from `gh run view --log`.

  # ── Why macOS called Valheim "damaged", measured rather than asserted ────────
  #
  # A user reported: `"valheim" is damaged and can't be opened`. The diagnosis is that
  # PhValheim 2.0.15 and earlier wrote Valheim.x86_64 into Valheim.app/Contents/MacOS/ and
  # codesigned it there, invalidating the bundle's sealed resource envelope.
  #
  # That is a claim about how codesign behaves, and it is cheap to actually test. This job
  # builds a synthetic signed bundle and measures four things in order:
  #
  #   1. a freshly signed bundle verifies            (control -- the harness can tell valid)
  #   2. adding a file under Contents/MacOS breaks it (the CAUSE)
  #   3. DELETING that file makes it verify again     (the REPAIR is complete)
  #   4. a shadow bundle with symlinked Resources runs and resolves its own bundle path
  #      (the replacement approach works)
  #
  # (3) is the one worth the runner time: RepairValheimBundle() only deletes, and never
  # re-signs, on the reasoning that the seal was computed over a tree without that file. If
  # that reasoning is wrong, affected users stay broken and we would not otherwise find out.
  bundle-seal:
    name: Bundle seal -- cause and repair
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Measure what an extra file does to a signed bundle
        timeout-minutes: 5
        run: |
          set -u
          PASS=0; FAIL=0
          ok(){   echo "  PASS: $1"; PASS=$((PASS+1)); }
          bad(){  echo "  FAIL: $1"; [ -n "${2:-}" ] && echo "        $2"; FAIL=$((FAIL+1)); }

          APP="$RUNNER_TEMP/Sealed.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>Sealed</string>
            <key>CFBundleIdentifier</key><string>com.phvalheim.sealtest</string>
            <key>CFBundleName</key><string>Sealed</string>
            <key>CFBundleVersion</key><string>1.0</string>
          </dict></plist>
          PLIST

          # A real Mach-O, because codesign will not seal a shell script as a main executable.
          cat > "$RUNNER_TEMP/seal.c" <<'C'
          #include <stdio.h>
          int main(void){ printf("sealed-ok\n"); return 0; }
          C
          cc -o "$APP/Contents/MacOS/Sealed" "$RUNNER_TEMP/seal.c"
          echo "data" > "$APP/Contents/Resources/payload.txt"

          codesign --force --sign - --deep "$APP"

          # 1. CONTROL. If a freshly signed bundle does not verify, nothing below means anything.
          if codesign --verify --strict --deep "$APP" 2>/dev/null; then
            ok "control: a freshly signed bundle verifies"
          else
            bad "a freshly signed bundle does NOT verify" \
                "the harness cannot distinguish valid from invalid; every result below is void"
          fi

          # 2. THE CAUSE. Exactly what PhValheim 2.0.15 did.
          cp "$APP/Contents/MacOS/Sealed" "$APP/Contents/MacOS/Sealed.x86_64"
          if codesign --verify --strict --deep "$APP" 2>/dev/null; then
            bad "an unlisted file under Contents/MacOS did NOT break the seal" \
                "the whole diagnosis for the 'damaged' report is wrong -- investigate before shipping"
          else
            ok "an unlisted file under Contents/MacOS INVALIDATES the seal (the reported cause)"
            echo "        verdict: $(codesign --verify --strict --deep "$APP" 2>&1 | head -1)"
          fi

          # And that is the state Gatekeeper reports as "damaged". Recorded, not gated:
          # spctl's wording and its treatment of ad-hoc signatures vary by OS version, so a
          # hard assertion here would be brittle. The codesign verdict above is the real claim.
          echo "        spctl:  $(spctl -a -vv "$APP" 2>&1 | head -2 | tr '\n' ' ')"

          # 3. THE REPAIR. Deleting the file must restore validity with the ORIGINAL signature.
          #    RepairValheimBundle() does exactly this and deliberately does not re-sign.
          rm -f "$APP/Contents/MacOS/Sealed.x86_64"
          if codesign --verify --strict --deep "$APP" 2>/dev/null; then
            ok "deleting the stray file restores the seal WITHOUT re-signing (the repair is complete)"
          else
            bad "the bundle is still invalid after deleting the stray file" \
                "RepairValheimBundle() would not be enough; affected users would need a Steam verify"
          fi

          # 4. THE REPLACEMENT. A shadow bundle whose heavy directories are symlinks back into
          #    a real install must still launch and resolve its own bundle path -- that is what
          #    lets Unity find Contents/Resources/Data.
          SHADOW="$RUNNER_TEMP/shadow/Sealed.app"
          rm -rf "$RUNNER_TEMP/shadow"; mkdir -p "$SHADOW/Contents/MacOS"
          cp "$APP/Contents/Info.plist" "$SHADOW/Contents/Info.plist"
          cc -o "$SHADOW/Contents/MacOS/Sealed" "$RUNNER_TEMP/seal.c"
          ln -s "$APP/Contents/Resources" "$SHADOW/Contents/Resources"
          codesign --force --sign - "$SHADOW/Contents/MacOS/Sealed"

          out=$("$SHADOW/Contents/MacOS/Sealed" 2>&1); rc=$?
          [ "$rc" -eq 0 ] && [ "$out" = "sealed-ok" ] \
            && ok "the shadow bundle's executable runs (rc=0)" \
            || bad "the shadow bundle's executable did not run" "rc=$rc out=$out"

          [ -r "$SHADOW/Contents/Resources/payload.txt" ] \
            && ok "Resources resolves through the symlink, so Unity would find its Data dir" \
            || bad "the symlinked Resources directory is not readable from the shadow bundle"

          # The game's own bundle must come away untouched by all of the above.
          if codesign --verify --strict --deep "$APP" 2>/dev/null; then
            ok "the original bundle is still valid after the shadow was built beside it"
          else
            bad "building the shadow bundle damaged the original"
          fi

          echo
          echo "$PASS passed, $FAIL failed"
          [ "$FAIL" -eq 0 ] || exit 1

  # ── The gate: build natively, install, prove it runs ─────────────────────────
  native:
    name: Native build + install + verify
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Read version
        id: ver
        run: |
          v=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' phvalheim-client.csproj | head -1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building $v"

      - name: Build the macOS tarball
        run: bash builders/build_macos-innie

      - name: Install via the shipped installer
        env:
          PHVALHEIM_TARBALL: builds/phvalheim-client-${{ steps.ver.outputs.version }}-macos-universal.tar.gz
        run: bash macinstall.sh install

      - name: Verify
        id: verify
        run: bash builders/verify_macos.sh "${{ steps.ver.outputs.version }}" "$RUNNER_TEMP/results.tsv"

      - name: Functionality report
        if: always()
        run: bash builders/ci_summary.sh "Native build — \`${{ steps.ver.outputs.version }}\` on Apple Silicon" "$RUNNER_TEMP/results.tsv"

      # Registration is not delivery. This drives a real phvalheim:// URL through
      # Launch Services and follows it to the argv the client receives.
      - name: phvalheim:// activation
        if: always()
        # Hard cap: this step drives the window server. Run 35813131570 hung
        # here and had to be cancelled by hand; without a cap the default is 6h.
        # The script's own waits total well under 2 minutes.
        timeout-minutes: 5
        run: bash builders/verify_macos_gui.sh "$RUNNER_TEMP/gui.tsv"

      - name: Activation report
        if: always()
        run: bash builders/ci_summary.sh "phvalheim:// activation — the full chain" "$RUNNER_TEMP/gui.tsv"

      # The installer's own diags are a separate voice: if they disagree with
      # verify_macos.sh, one of the two is lying and that is worth seeing.
      - name: Installer diags
        if: always()
        run: bash macinstall.sh diags || true

      - name: Uninstall cleanly
        if: always()
        run: |
          bash macinstall.sh uninstall
          rc=0
          [ -e /usr/local/bin/phvalheim-client ] && { echo "FAIL: binary survived uninstall"; rc=1; }
          [ -e "/Applications/PhValheim Client.app" ] && { echo "FAIL: app survived uninstall"; rc=1; }
          [ $rc -eq 0 ] && echo "✅ Uninstall removed both artifacts" >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-universal-tarball
          # Pin the version. `builds/*macos-universal.tar.gz` also matches the
          # 2.0.12 tarball committed in the repo, so the artifact arrived with
          # two files in it and whoever downloads it has to pick correctly --
          # which is exactly the mistake that put a renamed 2.0.12 on the
          # 2.0.13 release in the first place.
          path: builds/phvalheim-client-${{ steps.ver.outputs.version }}-macos-universal.tar.gz
          if-no-files-found: error

  # ── Does the Linux-built artifact run on Apple Silicon? ──────────────────────
  # docs/MACOS-BUILD-ON-LINUX.md proved a Linux box can produce a signed
  # universal binary that is structurally identical to a Mac-built one. Only a
  # real Mac can tell us whether "structurally identical" means "runs".
  cross-build:
    name: Cross-build on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish both slices
        run: |
          for rid in osx-x64 osx-arm64; do
            dotnet publish -c macOS-Release -r $rid \
              -p:PublishSingleFile=true --self-contained true /p:PublishTrimmed=false \
              ./phvalheim-client.csproj
          done

      - name: Fuse and ad-hoc sign with rcodesign
        run: |
          gh release download apple-codesign/0.29.0 --repo indygreg/apple-platform-rs \
            --pattern '*x86_64-unknown-linux-musl*.tar.gz' --dir /tmp
          tar -xzf /tmp/*x86_64-unknown-linux-musl.tar.gz -C /tmp
          rc=$(find /tmp -name rcodesign -type f | head -1)
          mkdir -p out
          "$rc" macho-universal-create -o out/phvalheim-client \
            bin/macOS-Release/net9.0/osx-x64/publish/phvalheim-client \
            bin/macOS-Release/net9.0/osx-arm64/publish/phvalheim-client
          "$rc" sign out/phvalheim-client
          chmod 755 out/phvalheim-client
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v4
        with:
          name: linux-crossbuilt-binary
          path: out/phvalheim-client

  cross-verify:
    name: Run the Linux-built binary on Apple Silicon
    runs-on: macos-15
    needs: cross-build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-crossbuilt-binary
          path: out

      - name: Smoke the cross-built binary
        run: |
          chmod 755 out/phvalheim-client
          R="$RUNNER_TEMP/cross.tsv"; : > "$R"
          row() { printf '%s\t%s\t%s\n' "$1" "$2" "$3" >> "$R"; }

          archs=$(lipo -archs out/phvalheim-client 2>/dev/null || echo none)
          case "$archs" in
            *x86_64*arm64*|*arm64*x86_64*) row PASS "Universal binary" "$archs" ;;
            *) row FAIL "Universal binary" "got: $archs" ;;
          esac

          if codesign --verify --strict out/phvalheim-client 2>/dev/null; then
            row PASS "Apple accepts the rcodesign signature" "codesign --verify --strict"
          else
            row FAIL "Apple accepts the rcodesign signature" "$(codesign --verify --strict out/phvalheim-client 2>&1 | head -1)"
          fi

          # The whole question, in one line.
          set +e
          o=$(./out/phvalheim-client 2>&1); rc=$?
          set -e
          case "$o" in
            *"No arguments were passed"*) row PASS "Linux-built binary EXECUTES on $(uname -m)" "rc=$rc, printed usage" ;;
            *) if [ "$rc" -ge 128 ]; then
                 row FAIL "Linux-built binary EXECUTES on $(uname -m)" "killed by signal $((rc-128)) — AMFI rejected it"
               else
                 row FAIL "Linux-built binary EXECUTES on $(uname -m)" "rc=$rc: $(echo "$o" | head -1)"
               fi ;;
          esac

          cat "$R"
          if awk -F'\t' '$1=="FAIL"' "$R" | grep -q .; then exit 1; fi

      - name: Cross-build report
        if: always()
        run: bash builders/ci_summary.sh "Linux cross-build, executed on Apple Silicon" "$RUNNER_TEMP/cross.tsv"
